name: rename driver apk
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rename APK and commit
        run: |
          set -e
          ls -l PRO-Driver-7.1-Fat.apk pro-driver.apk
          test "$(stat -c%s PRO-Driver-7.1-Fat.apk)" = "22743225"
          rm -f pro-driver.apk
          git mv PRO-Driver-7.1-Fat.apk pro-driver.apk
          test "$(stat -c%s pro-driver.apk)" = "22743225"
          rm -f .github/workflows/rename-driver.yml
          git config user.name "keimojan"
          git config user.email "keimojan@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "PRO Driver 7.1 universal (arm64 + 32-bit)"
          git push
